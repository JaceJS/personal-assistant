app = "savyn-api-staging"
primary_region = "sin"

[build]

[env]
APP_ENV = "staging"
LOG_LEVEL = "INFO"
STT_MODEL = "openai/whisper-1"
LLM_MODEL = "google/gemini-2.5-flash-lite"
RECEIPT_MODEL = "google/gemini-2.5-flash-lite"

[processes]
app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
worker = "arq app.workers.voice_processor.WorkerSettings"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
processes = ["app", "worker"]
